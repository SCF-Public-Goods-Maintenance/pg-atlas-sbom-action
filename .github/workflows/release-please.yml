name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Update floating major and minor tags
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "v${{ steps.release.outputs.major }}" -m "Release v${{ steps.release.outputs.major }}"
          git tag -fa "v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}" -m "Release v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
          git push -f origin "v${{ steps.release.outputs.major }}" "v${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}"
